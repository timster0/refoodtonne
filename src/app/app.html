<main class="app-shell">
  <section class="catalog-card">
    <div class="image-panel">
      <div class="status-pill" [class.rejected]="isRejected">
        {{ isRejected ? 'MÖP ⚠️ TOT ☠️! Doch nicht in die Refood-Tonne!!' : 'Ja, darf es!' }}
      </div>
      <div class="image-stack">
        <img
          [src]="'/120l_tonne_refood.png'"
          alt="Refood-Tonne"
          class="tonne-image"
          [class.grayscale]="isRejected"
          [class.wobble]="wobbleActive()"
        />
        <img [src]="'/housemd.png'" class="house-overlay" [class.visible]="overlayVisible()">
        <!-- <div class="house-overlay" [class.visible]="overlayVisible()"></div> -->
      </div>
      <p class="eyebrow">Sonderfall-Analyse</p>
      <h1>{{ question }}</h1>
    </div>

    <div class="content-panel">

      <div class="controls" role="list" aria-label="Konfigurations-Liste">
        @for (option of options(); track option.id) {
          <div class="toggle-row">
            <div class="toggle-copy">
              <span class="toggle-label">{{ option.label }}</span>
            </div>
            <button
              type="button"
              class="toggle"
              [class.active]="option.active"
              (click)="toggle(option.id)"
              [attr.aria-pressed]="option.active"
            >
              <span class="toggle-switch"></span>
            </button>
          </div>
        }
      </div>
    </div>
  </section>
</main>
